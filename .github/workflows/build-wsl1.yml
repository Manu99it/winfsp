name: build-wsl1

# Builds the driver and the DLL of the wsl1-volfs branch (test-signed, x64 Release)
# and uploads them as an artifact. Not a release build: no installer, no Microsoft signature.

on:
  push:
    branches: [wsl1-volfs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: microsoft/setup-msbuild@v2
    - name: Put WDK tools (stampinf, inf2cat, signtool) on PATH
      shell: pwsh
      run: |
        $kits = 'C:/Program Files (x86)/Windows Kits/10/bin'
        $bin = Get-ChildItem $kits -Directory |
          Where-Object { Test-Path (Join-Path $_.FullName 'x86/stampinf.exe') } |
          Sort-Object Name | Select-Object -Last 1
        Join-Path $bin.FullName 'x86' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        Join-Path $bin.FullName 'x64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        "using $($bin.FullName)"
    - name: Build driver and DLL
      shell: cmd
      run: msbuild build\VStudio\winfsp.sln /m /t:winfsp_sys;winfsp_dll /p:Configuration=Release /p:Platform=x64 /p:MyTargetPlatformVersion=10.0.26100.0 /p:MyNtddiVersion=0x0A000006 /p:MyWin32Version=0x0A00
    - uses: actions/upload-artifact@v4
      with:
        name: winfsp-wsl1-x64
        path: |
          build/VStudio/build/Release/winfsp-x64.sys
          build/VStudio/build/Release/winfsp-x64.dll
          build/VStudio/build/Release/winfsp-x64.pdb
          build/VStudio/build/Release/*.cer
          build/VStudio/build/Release/driver-x64.*
        if-no-files-found: warn
    - name: Publish as a prerelease (artifact downloads count against the account quota)
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = "wsl1-volfs-${{ github.run_number }}"
        $out = 'build/VStudio/build/Release'
        $files = Get-ChildItem $out -File |
          Where-Object { $_.Name -match '^winfsp-x64\.(sys|dll)$|\.(cer|pdb)$|^driver-x64\.' } |
          ForEach-Object FullName
        $files
        gh release create $tag --repo ${{ github.repository }} --target ${{ github.sha }} --prerelease `
          --title "WSL 1 test build ${{ github.run_number }}" `
          --notes "Test-signed x64 build of the wsl1-volfs branch. Loads only with test signing enabled." @files
